name: Release

# Push a tag such as v0.1.0 (after bumping the version everywhere, see RELEASING.md): the packages are
# built and tested for every distribution, checksummed, optionally signed, and attached to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in CMakeLists.txt
        run: |
          version=$(sed -n 's/^project(LinuxHardwareMonitor VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the project version $version"
            exit 1
          fi
          python3 tools/check_release_metadata.py
      # Everything the workflow built: the DEBs, the RPM and source RPM, the source archive, the PKGBUILD.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          mv .SRCINFO SRCINFO # GitHub does not keep a leading dot in an asset name
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Sign the checksums (only when a key is configured)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "No GPG_PRIVATE_KEY secret: the release is published without a signature."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          gpg --batch --armor --export > dist/signing-key.asc
      - name: Release notes
        run: python3 tools/release_notes.py > release-notes.md && cat release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Linux Hardware Monitor ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
