name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call: # also used by the release workflow, which publishes the packages built here

jobs:
  build:
    name: ${{ matrix.tag }}
    runs-on: ubuntu-latest
    # Qt 6.5+ is required and the packages must have the dependencies of the distribution they are built
    # for, so each one is built (and tested) in a container of that distribution.
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:26.04", tag: ubuntu26.04 }
          - { image: "ubuntu:24.04", tag: ubuntu24.04 } # Qt 6.4: builds with the guards for the Qt 6.5 API
          # Qt 6.2: Qt6Quick needs Qt6OpenGL (a package of its own there) and the OpenGL headers, which qt6-base-dev
          # only pulls in from later versions on
          - { image: "ubuntu:22.04", tag: ubuntu22.04, extra: "libqt6opengl6-dev libgl1-mesa-dev" }
          - { image: "debian:13", tag: debian13 }
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build python3 git ca-certificates \
              qt6-base-dev qt6-declarative-dev \
              qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
              qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript \
              dbus fonts-dejavu-core file lintian appstream desktop-file-utils ${{ matrix.extra }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, so a release is built as "v0.2.0" and not as a bare commit
      - name: Let git read the workspace
        # The container user is not the owner of the checkout and git refuses such a directory; without this the
        # build cannot ask git which commit it comes from and --version / the About page lose their Build line.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DHWMON_DISTRO_TAG=${{ matrix.tag }}
      - name: Build
        run: cmake --build build
      - name: Show the version
        run: |
          build/LinuxHardwareMonitor --version
          build/LinuxHardwareMonitor --version | grep -q '^Build: ' # fail when the commit could not be determined
      - name: Test
        run: dbus-run-session -- ctest --test-dir build --output-on-failure
      - name: Package
        run: cd build && cpack -G DEB
      - name: Check the metadata files
        run: |
          desktop-file-validate packaging/linux-hardware-monitor.desktop
          appstreamcli validate --no-net packaging/io.github.zbara.LinuxHardwareMonitor.metainfo.xml
      - name: Lintian
        run: lintian --no-cfg --fail-on error,warning build/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.tag }}
          path: build/*.deb
          if-no-files-found: error

  # The source archive of this commit: the RPM and the Arch package are built from it, and the release publishes it
  # (the PKGBUILD downloads it by its checksum).
  source:
    name: source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make the archive
        run: |
          version=$(sed -n 's/^project(LinuxHardwareMonitor VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p out
          git archive --format=tar --prefix="linux-hardware-monitor-$version/" HEAD | gzip -n > "out/linux-hardware-monitor-$version.tar.gz"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: out/*.tar.gz
          if-no-files-found: error

  rpm:
    name: rpm (${{ matrix.tag }})
    needs: source
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "fedora:latest", tag: fedora }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: source
      - name: Build the RPM (the tests run inside the build) and check it with rpmlint
        run: tools/build_rpm.sh source/linux-hardware-monitor-*.tar.gz out
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.tag }}
          path: out/linux-hardware-monitor-[0-9]*.rpm   # the program and the source RPM, not the debug packages
          if-no-files-found: error

  arch:
    name: arch
    needs: source
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: source
      - name: Build the package (the tests run inside the build) and check it with namcap
        run: tools/build_arch.sh source/linux-hardware-monitor-*.tar.gz out
      - uses: actions/upload-artifact@v4
        with:
          name: arch-pkgbuild
          # The PKGBUILD with the checksum of the archive above and its .SRCINFO; they are published with the release.
          path: |
            out/PKGBUILD
            out/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
